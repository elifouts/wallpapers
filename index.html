<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Wallpapers</title>
<style>
body{font:15px system-ui;background:#111;color:#ddd;max-width:1100px;margin:auto;padding:16px}
summary{cursor:pointer;font-size:1.2em;padding:10px 0;text-transform:capitalize}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;padding-bottom:12px}
img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;display:block;background:#222}
button{width:100%;margin-top:4px;padding:6px;background:#222;color:#ddd;border:1px solid #333;border-radius:6px;cursor:pointer}
</style>
<h1>Wallpapers</h1>
<script>
// works for any user.github.io/repo, every top level folder becomes a dropdown
const repo = location.hostname.endsWith('github.io') ? `${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}` : 'elifouts/wallpapers'
const raw = `https://raw.githubusercontent.com/${repo}/main/`
fetch(`https://api.github.com/repos/${repo}/git/trees/main?recursive=1`).then(r => r.json()).then(({ tree }) => {
  const groups = {}
  for (const { path } of tree) if (path.includes('/') && /\.(jpe?g|png|gif|webp)$/i.test(path)) (groups[path.split('/')[0]] ??= []).push(path)
  for (const [name, files] of Object.entries(groups)) document.body.insertAdjacentHTML('beforeend',
    `<details><summary>${name} (${files.length})</summary><div class=g>${files.map(p =>
      `<div><img loading=lazy src="${raw + p}"><button onclick="dl('${p}')">Download</button></div>`).join('')}</div></details>`)
})
// download attr is ignored cross origin so go through a blob, still full quality
async function dl(p) {
  const a = document.createElement('a')
  a.href = URL.createObjectURL(await (await fetch(raw + p)).blob())
  a.download = p.split('/').pop()
  a.click()
}
</script>
